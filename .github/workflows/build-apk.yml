name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/build/reports/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.19' }}
          name: "GS TV Launcher Ultra v3.2.19 (Build 45)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.19 (Build 45)
            - 🔒 **Matinee (Jarvis322/matinee) Mimarisiyle Sabit Başlatıcı:** Donanımsal KEYCODE_HOME yakalama, :homekey izole süreci, stock launcher dinamik filtreleme ve TV'nin 'kendi kendine kapanma' sorununu çözen tek tıkla Otomatik ADB desteği (Local ADB dadb).
            - 🎨 **Açılır-Kapanır Renk Kartelası:** Ayarlar menüsünde yer kaplamaması için akordeon toggle yapısına geçirildi.
            - ✨ **Sade ve Modern 2026 Üst Bar:** Üst bardaki tüm metin etiketleri kaldırıldı, sadece 36px dairesel cam tasarım ikonlar (Wi-Fi, Hız, Bildirim, TV, Güncelleme, Düzen, Ayarlar) bırakıldı.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
