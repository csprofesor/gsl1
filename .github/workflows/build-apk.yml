name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/build/reports/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.21' }}
          name: "GS TV Launcher Ultra v3.2.21 (Build 47)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.21 (Build 47)
            - 🎯 **Projectivy Launcher (miproja1) Birebir Erişilebilirlik Paritesi:** Projectivy Launcher kaynak kodları ve APK manifesti incelenerek erişilebilirlik servis yapılandırması birebir uyarlandı.
            - 🔑 **Kapanma Sorunu Çözümü (canRetrieveWindowContent='true'):** Android TV ve Mi Box sistemlerinde erişilebilirlik servisinin `canRetrieveWindowContent='false'` iken donanımsal tuş filtrelemesi isteyememesi nedeniyle servisin hemen kapanması sorunu giderildi.
            - ⚡ **Temiz XML Konfigürasyonu & AndroidManifest enabled='true':** `settingsActivity` ve yetkilendirmeler Projectivy Launcher ile aynı standartta yapılandırıldı; statik XML çakışmaları temizlendi.
            - 🔙 **Ayar Menüsünden Geri Dönüşte Konum Koruma:** Erişilebilirlik menüsünden geri dönüldüğünde kalınan yer korunur.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
