name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/build/reports/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.23' }}
          name: "GS TV Launcher Ultra v3.2.23 (Build 49)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.23 (Build 49)
            - 🛡️ **Sabit Başlatıcı Erişilebilirlik Hizmeti Kök Onarımı (TVAccessibilityService):** Android TV ve Xiaomi Mi Box sistemlerinde erişilebilirlik anahtarının açıldıktan sonra kendi kendine kapanması sorunu kökten çözüldü.
            - 📑 **XML Geri Bildirim Tipi (feedbackGeneric):** `accessibility_service_config.xml` içine `accessibilityFeedbackType="feedbackGeneric"` ve `flagRequestFilterKeyEvents|flagDefault` eklendi; Android TV ayarlarının servisi kapalı sayıp anahtarı geri atması engellendi.
            - 🛡️ **Null-Safe Sistem Taraması:** `stockHomeActivities()` taranırken oluşan `ResolveInfo` / `activityInfo` çökmeleri tamamen engellendi, tüm çağrılar try-catch ve null-safe korumaya alındı.
            - ⏳ **Ayarlar Ekranında Kalma Koruması:** `onServiceConnected()` içerisindeki zamansız `openLauncher()` kaldırıldı; kullanıcı ayarları yaparken uygulamanın zorla ana ekrana çekilmesi engellendi.
            - 🔍 **GSTV_Accessibility Logcat Teşhis Sistemi:** Servis bağlandı, tuş yakalandı veya kesildi durumları için Logcat üzerinden anlık hata takip altyapısı sağlandı.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
