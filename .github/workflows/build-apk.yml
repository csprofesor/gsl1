name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.3
          name: "GS TV Launcher Ultra v3.2.3 (Build 29)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.3 (Build 29)
            - 🎬 **Kaldığın Yerden Devam Et Rafı:** Sahte/mock filmler tamamen kaldırıldı. Liste tamamen boş başlar ve yalnızca kullanıcının bilfiil başlattığı gerçek filmler listelenir.
            - 🎨 **Kişisel Tema Stüdyosu & Geniş Renk Kartelası:** Kontrol Merkezi Düzen sekmesinde 36 zengin TV rengi (Mavi, Yeşil, Turuncu, Kırmızı, Mor, Platin), canlı tema önizleme kutusu.
            - ✨ **Çok Parametreli Canlı Tema Ayarları:** Parlama & Neon Işıltısı (Kapalı, Zarif, Dengeli Neon, Güçlü Işıltı), Cam Saydamlığı (%8 Şeffaf, %18 Buzlu, %32 Koyu, %55 Katı) ve Kenarlık Çerçeve stili (İnce, Standart, Kalın Neon).
            - 📋 **Film İsmi Kopyalama & Oynatıcıda Otomatik Arama:** Seçilen uygulamada (Cloudstream, Stremio, YouTube, vb.) filmin adı hem panoya kopyalanır hem de arama intenti ile doğrudan açılır.
            - 🔑 **Resmi EAS Keystore İmzası:** Sorunsuz güncelleme desteği.
            - 📦 **Google Play Store Paketi (.AAB) & Sideload APK:** Hem Play Store hem doğrudan kurulum desteği.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
