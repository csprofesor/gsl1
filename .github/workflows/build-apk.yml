name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/build/reports/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.20' }}
          name: "GS TV Launcher Ultra v3.2.20 (Build 46)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.20 (Build 46)
            - 🔄 **TV Ayarlarından / Erişilebilirlikten Geri Dönüşte Konum Koruma:** TV Erişilebilirlik veya sistem ayarlarına gidip geri (Back) tuşuna basıldığında uygulamanın sıfırlanıp ana sayfadan başlaması sorunu çözüldü. Ayrıldığınız yer (Sabit Başlatıcı ve Kontrol Merkezi) tam olarak korunur.
            - 🔒 **Optimize Edilmiş TVAccessibilityService (Mi Box & Android TV):** Service binding ve lifecycle ayarları Mi Box için optimize edildi (exported=true, doğrudan süreç, typeWindowStateChanged ve KEYCODE_HOME yakalama).
            - 🏠 **Alternatif: TV Varsayılan Başlatıcı (Home App) Menüsü:** TV'nizin desteklemesi halinde varsayılan başlatıcı olarak doğrudan GS Launcher'ı seçebileceğiniz hızlı ayar butonu eklendi.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
