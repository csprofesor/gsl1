name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.0
          name: "GS TV Launcher v3.2.0 (Build 26)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.0 (Build 26)
            - 🔄 **Kaldığın Yerden Devam Et & Son İzlenenler Onarıldı:** Uygulama veya film açıldığında otomatik kaydedilir, tıklanınca hemen çalışır.
            - ⭐ **Tüm Uygulamalar Başa Alındı:** Filtre sekmelerinde ilk sıraya geri getirildi.
            - 📸 **Özel Duvar Kağıdı / Fotoğraf:** Kedi, aile, manzara hazır şablonları, internet URL girişi ve QR kod ile telefondan fotoğraf yükleme desteği.
            - 🍿 **Canlı & Dinamik IMDb Vitrini:** Cinemeta API ile her açılışta ve her cihazda değişken, taze film ve dizi vitrini.
            - ⚡ **Xiaomi Mi Box Sabit Başlatıcı Onarımı:** Leanback ve TV intentleri ile 'Bu işlemi işleyecek uygulama yok' sorunu çözüldü.
            - 🚀 **TV Açılışında Otomatik Başlatma (BootReceiver):** TV açıldığında GS TV Launcher doğrudan devreye girer.
          files: android/app/build/outputs/apk/release/app-release.apk
