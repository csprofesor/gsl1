name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.2
          name: "GS TV Launcher Ultra v3.2.2 (Build 28)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.2 (Build 28)
            - 🎬 **Kaldığın Yerden Devam Et Tamamen Yenilendi:** Eski uygulama kartları temizlendi, 5 popüler IMDb filmiyle başlatıldı, sadece gerçek film içerikleri gösterilir.
            - ⭐ **Saf IMDb Vitrin Rozetleri:** Tüm harici platform isimleri kaldırılarak vitrin ve öneriler saf IMDb olarak sabitlendi.
            - 📋 **Film İsmi Kopyalama & Oynatıcıda Otomatik Arama:** Seçilen uygulamada (Cloudstream, Stremio, YouTube, vb.) filmin adı hem panoya kopyalanır hem de arama intenti ile doğrudan açılır.
            - 🎨 **Tema Özelleştirme:** Kontrol Merkezi Düzen sekmesinde 13 canlı renk paleti ve özel HEX renk kodu desteği.
            - 🔑 **Resmi EAS Keystore İmzası:** Sorunsuz güncelleme desteği.
            - 📦 **Google Play Store Paketi (.AAB) & Sideload APK:** Hem Play Store hem doğrudan kurulum desteği.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
