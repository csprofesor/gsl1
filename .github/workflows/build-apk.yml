name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.12' }}
          name: "GS TV Launcher Ultra v3.2.12 (Build 38)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.12 (Build 38)
            - 🖼️ **8 Farklı Uygulama İkon Çerçevesi:** Sade, Neon, Glass, Gold, Cyber, Gradient, Çift Çizgi, Kalın Vurgu.
            - 📐 **Ana Ekran Bölümlerini ve Widget'ları Taşıma / Sıralama:** ⬆️ / ⬇️ butonlarıyla yukarı/aşağı taşıma ve göz ikonuyla gizleme/gösterme.
            - 🧩 **6 Farklı İnteraktif Widget:** Canlı Hava Durumu, Sistem RAM & Hızlandırma, İnternet Hızı & Wi-Fi, Trakt & Stremio İzleme Senkronu, Aile Fotoğrafı Dijital Çerçeve, Canlı TV Kanalları.
            - 🔷 **Çok Boyutlu Widget Şekilleri:** Kare 1x1, Geniş 2x1, Kapsül Çubuğu, Standart Liste görünüm modları.
            - 🎛️ **"📐 Ana Ekran & Widget Düzenle" Modalı:** Üst bar butonu ve Ayarlar > Düzen sekmesinden anında erişim.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
