name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.9' }}
          name: "GS TV Launcher Ultra v3.2.9 (Build 35)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.9 (Build 35)
            - 🔌 **Eklentiler & Senkronizasyon Merkezi:** Stremio, Kodi, VLC, Plex gibi uygulamalarla tam uyumlu modüler eklenti sistemi.
            - 🔴 **Trakt.tv Scrobbler & OAuth Device Flow:** TV ekranından tek kullanımlık kodla (`trakt.tv/activate`) doğrudan bağlanma ve tüm uygulamalardaki izleme geçmişini tek tıkla çekme.
            - 🟣 **Stremio Yerel Daemon Köprüsü:** Cihazdaki yerel Stremio akış motoru (`127.0.0.1:11470`) ile haberleşme ve anlık kütüphane eşleşmesi.
            - 📺 **Android TV Sistem Kanalları (TvContract):** SmartTube, YouTube, VLC gibi uygulamaların sistem kanallarından içerik içe aktarma.
            - 🛡️ **Google Play Store & Apple App Store Tam Uyum:** Kesinlikle telifli yayın veya scraper barındırmayan %100 yasal saf metaveri mimarisi; mağaza satışına hazır.
            - ⚡ **Sıfır Döngü Doğrudan Oynatma:** Kaldığın Yerden Devam Et kartına basıldığında hedef uygulama anında film adı kopyalanmış ve derin bağlantılı olarak başlar.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
