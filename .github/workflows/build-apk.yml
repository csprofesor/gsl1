name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            android/app/build/reports/
            android/build/reports/

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.22' }}
          name: "GS TV Launcher Ultra v3.2.22 (Build 48)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.22 (Build 48)
            - ✨ **2026 Profesyonel İkon Paketleri Entegrasyonu:** Kullanıcının sağladığı `GSTV_Glossy_Icon_Assets` ve `GSTV_System_Topbar_Icon_Pack` ikon paketleri projeye entegre edildi.
            - 🔝 **Modern Üst Bar (Topbar):** Üst çubuktaki emoji simgeleri kaldırıldı; Wi-Fi, Sistem/RAM, Bildirimler, Canlı TV, Güncelleme, Düzen, Ayarlar ve Canlı Hava Durumu için yüksek kaliteli profesyonel saydam ikonlar uygulandı.
            - 📱 **2026 3D Glossy Uygulama İkonları:** Kurulu uygulamalar ve popüler medya servisleri (Netflix, YouTube, Prime Video, Disney+, HBO Max, Spotify, Chrome, Google Play vb.) için modern 3D Glossy ikonlar uygulandı.
            - ⚙️ **Kontrol Merkezi & Modal İkon Modernizasyonu:** Tüm ayar karoları ve sistem modalları (Wi-Fi arama, Sabit Başlatıcı, Canlı TV, Güncelleme vb.) yeni vektörel sistem ikonlarıyla donatıldı.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
