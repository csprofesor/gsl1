name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.5
          name: "GS TV Launcher Ultra v3.2.5 (Build 31)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.5 (Build 31)
            - 🍿 **IMDb Popüler Film & Dizi Kartları Şeridi:** Kullanıcıların kumandayla D-pad sağ/sol yön tuşlarıyla 20'den fazla IMDb filmini afişleriyle gezip doğrudan seçebileceği yatay kart şeridi eklendi.
            - 🖼️ **Afiş Yükleme & Çift Proxy Hatası Düzeltildi:** Görsel URL'lerinin çift encode edilmesi engellendi, yüklenemeyen afişler için şık kart tasarımı ve IMDb rozetleri sağlandı.
            - 🔍 **Arama Kutusuna Otomatik Film Adı Yazma:** TV oynatıcı uygulaması (Cloudstream, Stremio, Nuvio, YouTube vb.) açıldığında film adı arama kutusuna otomatik aktarılır ve panoya kopyalanır.
            - 📺 **Android TV Watch Next Düzeltmesi:** `READ_TV_LISTINGS` izni eklendi, SQLite syntax ve LIMIT hataları giderilerek TV işletim sisteminin izleme geçmişi tam uyumlu hale getirildi.
            - ⚡ **Tek Tıkla Doğrudan Oynatma:** Kaldığın Yerden Devam Et kartına tıklandığında doğrudan oynatıcı açılır.
            - 📦 **Play Store AAB & Sideload APK:** İmzalı paketler hazır.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
