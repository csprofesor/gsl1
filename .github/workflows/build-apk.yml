name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.7' }}
          name: "GS TV Launcher Ultra v3.2.7 (Build 33)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.7 (Build 33)
            - 📺 **Android TV Watch Next (Kaldığın Yerden Devam Et) Tam Çözümü:** Projectivy Launcher standartlarında `READ_TV_LISTINGS` runtime izin denetimi ve tek tıkla izin isteme diyaloğu eklendi.
            - ⚡ **Canlı ContentObserver (Anında Algılama):** Netflix, Stremio, YouTube, VLC veya CloudStream'de video izlendiğinde ve çıkıldığında başlatıcı anında haberdar olur ve listeyi canlı yeniler.
            - 🧪 **Ekranda Canlı Test Et Butonu:** Kullanıcının TV üzerinde sistem sağlayıcısını anında doğrulayabilmesi için "🧪 Test Et" (gerçek sistem yayını ekleme/silme) butonu ve Kontrol Merkezi Sistem sekmesinde tanılama paneli eklendi.
            - 🎯 **Temiz ve Hızlı:** Sıralama en son izlenen içerik en başta olacak şekilde `last_engagement_time_utc_millis` ile optimize edildi.
            - 📦 **Play Store AAB & Sideload APK:** İmzalı paketler hazır.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
