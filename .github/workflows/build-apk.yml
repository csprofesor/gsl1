name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.1
          name: "GS TV Launcher Ultra v3.2.1 (Build 27)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.1 (Build 27)
            - 🎨 **Tema Özelleştirme (Kendi Özel Temanı Tasarla):** Kontrol Merkezi Düzen sekmesine 13 canlı renk paleti ve özel HEX renk kodu (#...) girişi eklendi.
            - 🖼️ **IMDb & Metahub Görsel Kilidi Çözüldü:** Türkiye ISP engeli Cloudflare CDN Edge proxy (wsrv.nl) ile aşıldı, tüm afiş ve film kartları anında yükleniyor.
            - 🎬 **Kaldığın Yerden Devam Et Kusursuzlaştırıldı:** Arka planda açılan uygulamaların film afişlerini ezmesi önlendi, filmler tıklandığında oynatıcı seçimi sunulur.
            - 📺 **Xiaomi Mi Box Sabit Başlatıcı Uyumluluğu:** Doğrudan TV Sistem Ayarları entegrasyonu ile 'Bu işlemi işleyecek uygulama yok' sorunu giderildi.
            - 🌅 **Ekran Koruyucu İyileştirmesi:** Ambiyans modundaki tuş bilgisi yazısı kaldırıldı, tam sinematik görsel deneyim sağlandı.
            - 🔑 **Resmi EAS Keystore İmzası:** Önceki sürümlerin üzerine sorunsuz güncellenir ("Uygulama yüklenemedi" hatası vermez).
          files: android/app/build/outputs/apk/release/app-release.apk
