name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.11' }}
          name: "GS TV Launcher Ultra v3.2.11 (Build 37)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.11 (Build 37)
            - 🛡️ **Sabit Başlatıcı ve Erişilebilirlik Servisi:** Android 13/14 'Kısıtlı Ayarlar' engeli için akıllı uyarı ve tek tıkla izin verme butonu eklendi.
            - 🔑 **Trakt.tv API Entegrasyonu:** Özel Client ID girme ve yapılandırma desteği ile kod alma sorunu çözüldü.
            - 📱 **QR Kod ve Fotoğraf Yükleme:** QR kod bağlantısı ve yerel IP tespiti yenilendi, dinamik IP yenileme eklendi.
            - 🔄 **Ayarlar Gezinti Hafızası:** Ayarlar menüsünden açılan alt pencerelerden (Hız, Wi-Fi, Fotoğraf vb.) geri dönüldüğünde kalınan sekmeye dönülmesi sağlandı.
            - 📶 **Uygulama İçi Wi-Fi Tarama & Üst Bar Canlı SSID:** Wi-Fi doğrudan uygulama içinde taranır ve bağlı ağın adı üst panelde görünür.
            - 🚀 **Yüksek Kontrastlı Roket Hız İkonu:** TV ekranında görünürlüğü artırıldı.
            - 📺 **Ekran Koruyucu Çakışma Önleyici:** Sistem ekran koruyucusu bastırılarak yalnızca launcher ekran koruyucusunun çalışması sağlandı.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
