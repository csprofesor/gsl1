name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.2.13' }}
          name: "GS TV Launcher Ultra v3.2.13 (Build 39)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.13 (Build 39)
            - 🎬 **Taşınabilir IMDb Vitrini & 5 Farklı Şekil:** Dikey Split (solda afiş, sağda uygulamalar), 1x1 Kare, 2x1 Geniş, Tek Satır Kapsül, Tam Genişlik Standart.
            - 📱 **Dikey Split Düzeni:** Solda uzunlamasına IMDb öneri afişi, sağda tek tıkla başlatılan hızlı uygulama ikonları.
            - 🗑️➕ **Widget Kaldırma & Yükleme:** Ana ekrandan widget silme ve galeriden dilediğinde geri yükleme imkanı.
            - 📰 **7 Yeni İçerik Widget'ı:** Canlı Haberler & Son Dakika Gündem, Canlı TV Radyo & Müzik Çalar, Canlı Skorlar & Fikstür, TV Kapanma / Uyku Zamanlayıcısı, TV Aile Hatırlatıcı Panosu, Günün Film Repliği & Trivia, Retro Oyun & Arcade Vitrini.
            - 🖼️ **8 İkon Çerçeve Stili & Gelişmiş Özelleştirme:** Tam kontrol ve Android TV mağaza uyumu.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
