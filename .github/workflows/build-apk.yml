name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Release APK & AAB (Play Store)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-binaries
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v3.2.4
          name: "GS TV Launcher Ultra v3.2.4 (Build 30)"
          draft: false
          prerelease: false
          body: |
            ## GS TV Launcher Ultra v3.2.4 (Build 30)
            - 📺 **Android TV Resmi Watch Next (Sıradaki / Devam Et) Entegrasyonu:** Netflix, YouTube, Stremio, Kodi, VLC vb. harici uygulamalarda izlenen gerçek içerikler ve bölümler TV ana ekranına anında otomatik yansır.
            - ⚡ **Tek Tıkla Doğrudan Kaldığın Yerden Oynat:** Devam et kartına tıklandığında ASLA tekrar "Uygulama Seç" modalı açılmaz; içerik doğrudan o uygulamanın oynatıcısında kaldığı dakikadan açılır.
            - 🖼️ **Görüntüsüz Kart Koruması:** Eksik veya boş afişli içeriklerde siyah kutu oluşması engellendi; şık degrade zemin, film ikonu ve platform rozeti gösterilir.
            - 🔄 **Kumanda Seçenekleri:** Karta uzun basıldığında "Farklı Uygulamayla Aç" ve "Listeden Kaldır" seçenekleri sunulur.
            - 🎨 **Canlı Tema Stüdyosu:** 36 renkli kartela ve ince ayarlar korunur.
            - 📦 **Play Store AAB & Sideload APK:** Her iki paket de imzalı olarak hazır.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
